# Test overrides — use in-memory H2 so tests don't need TCP server
quarkus.datasource.jdbc.url=jdbc:h2:mem:testinsurancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Smaller seed for tests (override if you want fewer records)
insurance.processing.page-size=100
insurance.processing.seda-concurrency=2
insurance.processing.thread-pool-size=4
insurance.processing.thread-pool-max-size=8

# Faster logging in tests
quarkus.log.level=WARN
quarkus.log.category."com.insurance".level=INFO
