# ============================================================
# Insurance Policy Camel POC - Application Configuration
# ============================================================

# Application
quarkus.application.name=insurance-camel-poc
quarkus.application.version=1.0.0-SNAPSHOT
quarkus.http.port=8080

# ============================================================
# H2 DATABASE - Server Mode (accessible via browser)
# ============================================================
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# TCP Server mode so H2 Console can connect from browser
quarkus.datasource.jdbc.url=jdbc:h2:mem:insurancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Connection pool tuning for bulk processing
quarkus.datasource.jdbc.min-size=10
quarkus.datasource.jdbc.max-size=50
quarkus.datasource.jdbc.acquisition-timeout=60
quarkus.datasource.jdbc.idle-removal-interval=PT5M
quarkus.datasource.jdbc.max-lifetime=PT30M
quarkus.datasource.jdbc.background-validation-interval=PT2M

# ============================================================
# FLYWAY - Database Migrations
# ============================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ============================================================
# H2 CONSOLE (Web UI)
# ============================================================
quarkus.h2.console.enabled=true
quarkus.h2.console.path=/h2-console

# ============================================================
# HEALTH & METRICS
# ============================================================
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# Micrometer / Prometheus
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Camel Micrometer
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# ============================================================
# CAMEL CONFIGURATION
# ============================================================
camel.context.name=InsurancePolicyCamelContext
#camel.context.streamCachingEnabled=true
#camel.context.stream-caching-enabled=true
#camel.context.stream-caching-spool-enabled=true
#camel.context.stream-caching-spool-directory=${java.io.tmpdir}/camel-spool
#camel.context.stream-caching-spool-threshold=65536
#camel.context.streamCachingBufferSize=65536

# Enable Camel JMX / Management
quarkus.camel.management.enabled=true

# ============================================================
# BULK PROCESSING CONFIGURATION (Custom)
# ============================================================
insurance.processing.page-size=1000
insurance.processing.seda-concurrency=10
insurance.processing.seda-queue-size=50000
insurance.processing.thread-pool-size=20
insurance.processing.thread-pool-max-size=40
insurance.processing.thread-pool-queue-size=10000
insurance.processing.batch-log-interval=5000

# ============================================================
# LOGGING
# ============================================================
quarkus.log.level=INFO
quarkus.log.category."com.insurance".level=DEBUG
quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.color=true

# ============================================================
# OPENAPI / SWAGGER
# ============================================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Insurance Policy Processing API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Quarkus + Apache Camel bulk insurance policy processor POC
